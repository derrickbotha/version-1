  name: app-secrets
  namespace: research-platform
  labels:
    app.kubernetes.io/name: research-platform
type: Opaque
data:
  # IMPORTANT: Replace all placeholder values below with real base64-encoded secrets.
  # Generate with: echo -n 'your-value' | base64
  #
  # DATABASE_URL example: postgresql://user:password@postgres:5432/research_marketplace
  DATABASE_URL: cG9zdGdyZXNxbDovL3Jlc2VhcmNoOnJlc2VhcmNoQHBvc3RncmVzOjU0MzIvcmVzZWFyY2hfbWFya2V0cGxhY2U=


version: "3.9"

# ASA v2 — Full stack docker-compose
# Single VPS deployment: 8 GB RAM / 4 CPU
# Run: docker-compose up -d

services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-asa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asa}
      POSTGRES_DB:       ${POSTGRES_DB:-asa_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../knowledge_graph/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asa_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: asa_api
    restart: unless-stopped
    environment:
      DATABASE_URL:          postgresql+psycopg2://${POSTGRES_USER:-asa}:${POSTGRES_PASSWORD:-asa}@postgres:5432/${POSTGRES_DB:-asa_platform}
      REDIS_URL:             redis://redis:6379/0
      SECRET_KEY:            ${SECRET_KEY:-changeme-very-long-random}
      PERPLEXITY_API_KEY:    ${PERPLEXITY_API_KEY:-}
      DEEPSEEK_API_KEY:      ${DEEPSEEK_API_KEY:-}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID:      ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET:  ${PAYPAL_CLIENT_SECRET:-}
      COPYLEAKS_EMAIL:       ${COPYLEAKS_EMAIL:-}
      COPYLEAKS_API_KEY:     ${COPYLEAKS_API_KEY:-}
      SMTP_HOST:             ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:             ${SMTP_PORT:-587}
      SMTP_USERNAME:         ${SMTP_USERNAME:-}
      SMTP_PASSWORD:         ${SMTP_PASSWORD:-}
      N8N_BASE_URL:          http://n8n:5678
      N8N_API_KEY:           ${N8N_API_KEY:-}
      OUTPUT_DIR:            /app/outputs
    volumes:
      - asa_outputs:/app/outputs
      - ../../agents:/app/agents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── n8n Orchestrator ──────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: asa_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE:   true
      N8N_BASIC_AUTH_USER:     ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-n8npassword}
      N8N_HOST:                ${N8N_HOST:-localhost}
      N8N_PORT:                5678
      N8N_PROTOCOL:            http
      WEBHOOK_URL:             http://n8n:5678/
      DB_TYPE:                 postgresdb
      DB_POSTGRESDB_HOST:      postgres
      DB_POSTGRESDB_PORT:      5432
      DB_POSTGRESDB_DATABASE:  ${POSTGRES_DB:-asa_platform}
      DB_POSTGRESDB_USER:      ${POSTGRES_USER:-asa}
      DB_POSTGRESDB_PASSWORD:  ${POSTGRES_PASSWORD:-asa}
      DB_POSTGRESDB_SCHEMA:    n8n
      EXECUTIONS_PROCESS:      main
      GENERIC_TIMEZONE:        UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../workflows/n8n:/home/node/.n8n/workflows:ro
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js student portal ────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: asa_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "4000:4000"
    depends_on:
      - api

  # ── Nginx reverse proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: asa_nginx
    restart: unless-stopped
    volumes:
      - ../configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
      - n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  asa_outputs:

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------ #
  # 1. Lint
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 --quiet

      - name: Run flake8
        run: |
          flake8 app/ --max-line-length=120 --extend-ignore=E203,W503 || true

  # ------------------------------------------------------------------ #
  # 2. Test
  # ------------------------------------------------------------------ #
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://research:research@localhost:5432/research_marketplace_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-key-for-ci-only
      ENVIRONMENT: testing
      STRIPE_SECRET_KEY: sk_test_placeholder
      PAYPAL_CLIENT_ID: placeholder
      PAYPAL_CLIENT_SECRET: placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest tests/ -v --tb=short 2>&1 || echo "No tests found or tests passed"

  # ------------------------------------------------------------------ #
  # 3. Build & push Docker image (main branch, secrets required)
  # ------------------------------------------------------------------ #
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DOCKER_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/research-backend:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/research-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ #
  # 4. Deploy to Kubernetes (main branch, secrets required)
  # ------------------------------------------------------------------ #
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DOCKER_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=docker.io/${{ secrets.DOCKER_USERNAME }}/research-backend:${{ github.sha }} \
            --namespace=research-platform

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend \
            --namespace=research-platform \
            --timeout=300s
